<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Track · ภารกิจวันนี้</title>
<meta name="theme-color" content="#EDF0EE">
<link rel="preload" href="fonts/kanit-700-thai.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
<script src="auth.js" data-role="tech"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3.5 8.5h3l1.5-2.5h8l1.5 2.5h3v10.5h-17z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="3.5" fill="none" stroke="currentColor" stroke-width="2.4"/></symbol>
  <symbol id="i-offline" viewBox="0 0 24 24"><path d="M3 9a14 14 0 0 1 4-2.4M21 9a14 14 0 0 0-8-3.9M6.5 12.8a9 9 0 0 1 3-1.8M17.5 12.8a9 9 0 0 0-1.6-1.2M10 16.5a4 4 0 0 1 4 0M4 4l16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/></symbol>
</svg>

<div class="app">
  <header class="bar">
    <span class="brand">Daily Track</span>
    <span class="who">สมชาย ป. · ข้อมูลตัวอย่าง</span>
  </header>

  <p class="net" id="net" role="status" hidden>
    <svg class="ic" aria-hidden="true"><use href="#i-offline"/></svg>
    <span id="netText"></span>
  </p>

  <section class="day" aria-label="สรุปวันนี้">
    <div class="date">
      <h1 id="date"></h1>
      <p id="weekday"></p>
    </div>
    <div class="prog" id="prog" role="img"></div>
    <p class="count" id="count"></p>
    <p class="hint" id="hint" hidden>แตะกล่องที่รอทำ ถ่ายรูปก่อนแล้วเริ่มงาน</p>
  </section>

  <ul class="list" id="list"></ul>

  <p class="note">
    <button type="button" id="reset">เริ่มตัวอย่างใหม่</button>
    <button type="button" id="empty">ดูวันที่ไม่มีงาน</button>
    <button type="button" id="logout">ออกจากระบบ</button>
  </p>
</div>

<input type="file" id="file" accept="image/*" capture="environment" hidden>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastText"></span>
  <button type="button" id="undo">เลิกทำ</button>
</div>

<script src="app.js"></script>
</body>
</html>
