<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Track · หัวหน้า</title>
<meta name="theme-color" content="#EDF0EE">
<link rel="preload" href="fonts/kanit-700-thai.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="supervisor.css">
<script src="auth.js" data-role="sup"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><path d="M4 6.5h16V20H4zM4 11h16M8.5 3.5v5M15.5 3.5v5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
</svg>

<div class="page">
<nav id="menu" class="menu" aria-label="เมนูหัวหน้า">
  <div class="mhead">
    <span class="brand">เมนู</span>
    <button type="button" class="x" id="menuClose" aria-label="ปิดเมนู"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
  </div>
  <p class="mgroup">งานประจำวัน</p>
  <ul>
    <li><a href="supervisor.html" class="mitem" aria-current="page">ภารกิจรายวัน</a></li>
    <li><span class="mitem soon" aria-disabled="true">รายงานประจำวัน<small>เร็วๆ นี้</small></span></li>
  </ul>
  <p class="mgroup">ตั้งค่า</p>
  <ul>
    <li><span class="mitem soon" aria-disabled="true">พนักงานและรหัสพนักงาน<small>เร็วๆ นี้</small></span></li>
    <li><span class="mitem soon" aria-disabled="true">สิทธิ์การใช้งาน<small>เร็วๆ นี้</small></span></li>
    <li><span class="mitem soon" aria-disabled="true">ตั้งค่าอื่นๆ<small>เร็วๆ นี้</small></span></li>
  </ul>
  <p class="mgroup">บัญชีของฉัน</p>
  <ul>
    <li><a href="profile.html" class="mitem">โปรไฟล์</a></li>
  </ul>
</nav>
<div class="scrim" id="scrim"></div>
<div class="content">

<header class="bar">
  <button type="button" id="menuBtn" class="ghost" aria-controls="menu" aria-expanded="true"><svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg>เมนู</button>
  <span class="brand">Daily Track</span>
  <p class="clock">เวลาตอนนี้ <b id="clock"></b></p>
  <button type="button" id="create" class="primary"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg>สร้างภารกิจ</button>
  <a class="ghost" href="profile.html" title="โปรไฟล์ของฉัน"><span id="whoName">หัวหน้า</span></a>
  <button type="button" id="logout" class="ghost">ออกจากระบบ</button>
</header>

<div class="layout">
  <main>
    <div class="daybar">
      <div>
        <h1 id="date"></h1>
        <p class="rel" id="rel"></p>
      </div>
      <div class="daynav" role="group" aria-label="เลือกวันที่">
        <button type="button" class="ghost icon" id="prev" aria-label="วันก่อนหน้า"><svg class="ic" aria-hidden="true"><use href="#i-left"/></svg></button>
        <span class="pickwrap">
          <button type="button" class="ghost" id="pick" aria-haspopup="dialog"><svg class="ic" aria-hidden="true"><use href="#i-cal"/></svg>เลือกจากปฏิทิน</button>
          <input type="date" id="day" class="dayin" aria-label="วันที่ที่แสดงในตาราง" tabindex="-1" min="2000-01-01" max="2099-12-31">
        </span>
        <button type="button" class="ghost icon" id="next" aria-label="วันถัดไป"><svg class="ic" aria-hidden="true"><use href="#i-right"/></svg></button>
        <button type="button" class="ghost" id="today" aria-disabled="true">วันนี้</button>
      </div>
      <p class="sr" id="dayLive" role="status" aria-live="polite"></p>
    </div>

    <div class="tools">
      <div class="seg" id="seg" role="group" aria-label="กรองตามสถานะ"></div>
      <label class="sel">ช่าง
        <select id="tech"></select>
      </label>
    </div>

    <div class="tablewrap">
      <table id="table">
        <thead><tr>
          <th scope="col" data-key="status" class="c-s"></th>
          <th scope="col" data-key="time" class="c-t"></th>
          <th scope="col" data-key="title"></th>
          <th scope="col" data-key="tech" class="c-h"></th>
          <th scope="col" class="c-p">รูปก่อน · หลัง</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden></div>
    </div>

    <p class="note">
      ข้อมูลตัวอย่าง · ยังไม่เชื่อมกับมือถือช่าง
      <button type="button" id="reset">เริ่มตัวอย่างใหม่</button>
    </p>
  </main>

  <aside id="drawer" class="drawer" aria-label="รายละเอียดภารกิจ"></aside>
</div>

</div>
</div>

<dialog id="lightbox" aria-labelledby="lbCap">
  <p id="lbCap"></p>
  <div id="lbBody"></div>
  <button type="button" id="lbClose" class="primary">ปิด</button>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<datalist id="places"></datalist>

<script src="supervisor.js"></script>
</body>
</html>
